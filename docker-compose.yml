version: '3.8'

services:
  knipsen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knipsen-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - UPLOAD_DIR=/app/uploads
      - DATABASE_PATH=/app/data/knipsen.db
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-100}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
    volumes:
      - knipsen-data:/app/data
      - knipsen-uploads:/app/uploads

volumes:
  knipsen-data:
    driver: local
  knipsen-uploads:
    driver: local
